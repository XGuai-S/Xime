name: Build and Test APK

on:
  push:
    branches:
      - main
      - dev*
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
        
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          cache-dependency-path: |
            gradle/libs.versions.toml
            **/*.gradle*
            **/gradle-wrapper.properties
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
        
      - name: Install NDK and SDK platform
        run: |
          sdkmanager "ndk;29.0.14206865" "platforms;android-37.2"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          
      - name: Cache native deps
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jni/onnxruntime
            app/src/main/jniLibs/**/libonnxruntime.so
          key: native-${{ runner.os }}-onnx-1.28.0
          restore-keys: |
            native-${{ runner.os }}-

      - name: Download native deps (ONNX Runtime)
        run: ./gradlew downloadOnnx --no-daemon --refresh-dependencies
      - name: Prepare Boost source (serialized for all ABI)
      - name: Prepare librime-lua plugin (serialized for all ABI)
        run: |
          LUA_SRC=app/src/main/jni/librime-lua
          LUA_DST=app/src/main/jni/librime/plugins/lua
          if [ -f "$LUA_DST/CMakeLists.txt" ]; then
            echo "librime-lua plugin already prepared"
            exit 0
          fi
          mkdir -p app/src/main/jni/librime/plugins
          cp -r "$LUA_SRC" "$LUA_DST"
          DEPS_SRC=app/src/main/jni/librime-lua-deps/lua5.4
          DEPS_DST=app/src/main/jni/librime/plugins/lua/thirdparty
          mkdir -p "$DEPS_DST"
          cp -r "$DEPS_SRC/." "$DEPS_DST/"
          echo "librime-lua plugin prepared"
        run: |
          BOOST_VER=1.89.0
          BOOST_DIR=app/src/main/jni/boost
          if [ -d "$BOOST_DIR" ] && [ -f "$BOOST_DIR/CMakeLists.txt" ]; then
            echo "Boost already prepared"
            exit 0
          fi
          URL="https://github.com/boostorg/boost/releases/download/boost-${BOOST_VER}/boost-${BOOST_VER}-cmake.tar.xz"
          curl -fL --retry 5 --retry-delay 3 -o /tmp/boost.tar.xz "$URL" || curl -fL --retry 5 -o /tmp/boost.tar.xz "https://ghproxy.net/$URL"
          echo "checking sha256"
          echo "67acec02d0d118b5de9eb441f5fb707b3a1cdd884be00ca24b9a73c995511f74  /tmp/boost.tar.xz" | sha256sum -c -
          rm -rf "$BOOST_DIR" app/src/main/jni/boost-1.89.0
          tar -xf /tmp/boost.tar.xz -C app/src/main/jni
          mv app/src/main/jni/boost-1.89.0 "$BOOST_DIR"
          echo "Boost prepared at $BOOST_DIR"
        
      - name: Cache CMake build
        uses: actions/cache@v6
        with:
          path: |
            app/.cxx
          key: cmake-${{ runner.os }}-${{ hashFiles('app/src/main/jni/CMakeLists.txt') }}-v3
            
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up Rust (xime-plugin CLI)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/xime-plugin/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/xime-plugin/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build Plugins (TS → JS)
        run: |
          cd tools/xime-plugin
          cargo run --quiet -- build --all --plugins-dir ../../plugins --out ../../build/plugin-js
          cargo run --quiet -- build test-fixture --out ../../build/plugin-js

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest :plugin-core:testDebugUnitTest --no-daemon
        
      - name: Generate Test Report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/testDebugUnitTest/*.xml'
          fail_on_failure: true
          
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 7
          
      - name: Build Debug APKs
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Plugin XIPKs
        run: bash scripts/build-plugins.sh

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            build/plugin-release/*.xipk
          retention-days: 7
