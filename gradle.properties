## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
#Sat Mar 28 10:46:25 CST 2026
android.enableJetifier=true
android.useAndroidX=true
kotlin.code.style=official
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Dfile.encoding=UTF-8 -Dcom.android.tools.r8.threads=4

# Disable toolchain auto-provisioning
org.gradle.java.installations.fromEnv=JAVA_HOME
# 并行构建 + 构建缓存：多模块并行执行、可复用产物命中缓存，显著缩短打包时间
org.gradle.parallel=true
org.gradle.caching=true
# 配置缓存：缓存配置阶段结果，省掉每次构建约 40 秒的项目配置时间
org.gradle.configuration-cache=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# R8 多线程加速
systemProp.com.android.tools.r8.threads=4
# 关闭 baseline profile（加快打包）
android.experimental.art-profile-verification=false
android.experimental.enableProfilingData=false
# 关闭 debug 变体调试信息
android.enableR8.fullMode=true
# Kotlin 增量编译 + 驻留模式加速
kotlin.incremental=true
# 提高并行 worker（6核）
org.gradle.workers.max=4
