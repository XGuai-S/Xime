## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=false
org.gradle.workers.max=4
#Sat Mar 28 10:46:25 CST 2026
android.enableJetifier=true
android.useAndroidX=true
kotlin.code.style=official
# 内存保守配置（用户 2026-11-14）：设备总内存 15GB 但可用常低于 6GB，
# 原 -Xmx4096m + parallel 在构建峰值会把系统内存压到触发 LMKD，
# 导致发起构建的 Eta 后台进程被杀（构建其实成功了，但结果没人看到）。
# 2GB 堆 + 关闭并行：构建稍慢，但不再挤爆内存。
# 单线程 R8 不需要为并发留堆外余量，但整份 dex 处理仍需较大堆：
# 4GB 是此前验证过的稳定值（3GB 在处理大 dex 时曾接近 OOM）。
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:MaxGCPauseMillis=300 -Dfile.encoding=UTF-8

# Disable toolchain auto-provisioning
org.gradle.java.installations.fromEnv=JAVA_HOME
# 并行构建 + 构建缓存：多模块并行执行、可复用产物命中缓存，显著缩短打包时间
org.gradle.parallel=false
org.gradle.caching=true
# 配置缓存：缓存配置阶段结果，省掉每次构建约 40 秒的项目配置时间
org.gradle.configuration-cache=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# R8 线程数：2026-11-27 实测（Ryzen 7 4800H，16 线程，可用内存约 2GB）：
#   threads=1 → 205s，threads=2 → 167s，threads=4 → 172s。
# 2 线程最快（省 38s），4 线程因堆外内存压力/换页反而略慢。
# 历史"单线程最快"是旧机器（骁龙）数据，已不适用，故改为 2。
systemProp.com.android.tools.r8.threads=2
# 关闭 baseline profile（加快打包）
android.experimental.art-profile-verification=false
android.experimental.enableProfilingData=false
# 关闭 debug 变体调试信息
android.enableR8.fullMode=true
# Kotlin 增量编译 + 驻留模式加速
kotlin.incremental=true
# 提高并行 worker（6核）

# arm64 主机（仅限该场景）：AGP 默认从 Maven 取 x86_64 的 aapt2，需改为本地 qemu wrapper。
# 该路径是 arm64 Linux 主机专用，写死会阻断其他平台（x86_64 Linux / Windows / macOS）的构建：
# AGP 启动即报 "Custom AAPT2 location does not point to an AAPT2 executable"。
# 因此默认注释，需要时在本机 local.properties 同目录临时启用，或经 -P 覆盖。
# android.aapt2FromMavenOverride=/opt/android-sdk/build-tools/36.0.0/aapt2

# ── 后台进程治理（2026-11-14 统一配置）──
# 空闲 3 分钟自动退出，避免常驻占用 500MB+
org.gradle.daemon.idletimeout=180000
# Kotlin 编译在 Gradle 进程内执行，不再单独常驻 ~500MB 守护进程
kotlin.compiler.execution.strategy=in-process