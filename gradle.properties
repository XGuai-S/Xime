## For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
#
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx1024m -XX:MaxPermSize=256m
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
#
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=false
org.gradle.workers.max=2
#Sat Mar 28 10:46:25 CST 2026
android.enableJetifier=true
android.useAndroidX=true
kotlin.code.style=official
# 内存保守配置（用户 2026-11-14）：设备总内存 15GB 但可用常低于 6GB，
# 原 -Xmx4096m + parallel 在构建峰值会把系统内存压到触发 LMKD，
# 导致发起构建的 Eta 后台进程被杀（构建其实成功了，但结果没人看到）。
# 2GB 堆 + 关闭并行：构建稍慢，但不再挤爆内存。
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -XX:MaxGCPauseMillis=300 -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Dcom.android.tools.r8.threads=2

# Disable toolchain auto-provisioning
org.gradle.java.installations.fromEnv=JAVA_HOME
# 并行构建 + 构建缓存：多模块并行执行、可复用产物命中缓存，显著缩短打包时间
org.gradle.parallel=false
org.gradle.caching=true
# 配置缓存：缓存配置阶段结果，省掉每次构建约 40 秒的项目配置时间
org.gradle.configuration-cache=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=false
android.newDsl=false

# R8 多线程加速。
# 注意：本机（8Gen3 arm64 proot）系统 load 基线约 4，R8 一旦并发过高就会与系统
# 抢 CPU/内存，导致构建卡死而非变快（曾用 6 线程 + 7GB 堆把内存撑爆直接超时）。
# 3 线程 + 4GB 堆是实测稳定且较快的一档。
systemProp.com.android.tools.r8.threads=3
# 关闭 baseline profile（加快打包）
android.experimental.art-profile-verification=false
android.experimental.enableProfilingData=false
# 关闭 debug 变体调试信息
android.enableR8.fullMode=true
# Kotlin 增量编译 + 驻留模式加速
kotlin.incremental=true
# 提高并行 worker（6核）

# arm64 主机：AGP 默认从 Maven 取 x86_64 的 aapt2，需改为本地 qemu wrapper
android.aapt2FromMavenOverride=/opt/android-sdk/build-tools/36.0.0/aapt2
